name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}
      - name: Catalog, generated indexes and links
        run: |
          pip install -r requirements-catalog.txt pytest
          python tools/generate_catalog.py --check
          python tools/check_markdown_links.py
          python -m pytest tests
      - name: Example configs are valid JSON
        run: for f in examples/*.json schemas/*.json codemeta.json; do python -m json.tool "$f" >/dev/null; done
